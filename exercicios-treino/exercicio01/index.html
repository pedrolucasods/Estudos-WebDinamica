<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculo Torque Articulação</title>
</head>
<body>
    <div class="container">
        <div class="title">
            <h2>Calculo Torque</h3>
        </div>
        <div class="calculo-content">
            <div class="inputs">
                <div class="input-bloco">
                    <h4>Força: </h4>
                    <input type="number" id="input_forca">
                </div>
                <div class="input-bloco">
                    <h4>Distancia: </h4>
                    <input type="number" id="input_distancia">
                </div>
            </div>
            <button id="calcular">Calcular</button>
            <div class="resultado" id="resultado">
                <span id="text-resultado"></span>
            </div>
        </div>
        
    </div>
</body>
<script src="script.js" defer></script>
</html>
